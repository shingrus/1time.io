## Development: build from source
## Usage:
##   docker compose -f docker-compose.dev.yml up -d --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
      - --dir
      - /data
      - --dbfilename
      - dump.rdb
    volumes:
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli ping)\" = PONG ]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      REDISHOST: redis:6379
      REDISPASS: ""
      FILE_STORAGE_DIR: /data/files
    volumes:
      - ${DATA_DIR:-./data}:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 30s
      start_interval: 1s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_HOSTNAME: ${APP_HOSTNAME:?Set APP_HOSTNAME in .env}
        SHOW_BLOG: ${SHOW_BLOG:-false}
    restart: unless-stopped
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME:?Set APP_HOSTNAME in .env}
      NGINX_PORT: 8080
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8080}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    ports:
      - "${APP_PORT:-8080}:8080"
