name: Publish deploy release

on:
  workflow_dispatch:
  push:
    tags: ['deploy-*']

permissions:
  contents: write

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [[ "$GITHUB_REF" == refs/tags/deploy-* ]]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^deploy-[A-Za-z0-9._-]+$ ]]; then
              echo "::error::no publish: tag name must match deploy-[A-Za-z0-9._-]+"
              exit 1
            fi
            if ! git rev-parse --verify --quiet refs/remotes/origin/master >/dev/null; then
              echo "::error::no publish: origin/master is not available"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
              echo "::error::no publish: tag ${GITHUB_REF_NAME} is not on master; push the commit to master, then tag origin/master"
              exit 1
            fi
            publish=true
            echo "publish: tag ${GITHUB_REF_NAME} is on a master commit"
          else
            echo "no publish: ${GITHUB_REF} is not a deploy-* tag"
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check and test backend
        shell: bash
        env:
          REDISHOST: 127.0.0.1:6379
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l backend)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./backend/...
          go test -race ./backend/...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install -g npm@11.12.1
          npm ci
          npm run build
        env:
          SELF_HOSTED: 'false'

      - name: Build backend and package
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_SHA"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME}@${GITHUB_SHA}"
          fi
          mkdir -p dist/release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/release/1time-api ./backend
          cp -R frontend/build dist/release/frontend
          cd dist
          tar -czf 1time-release.tar.gz -C release 1time-api frontend
          sha256sum 1time-release.tar.gz > 1time-release.tar.gz.sha256

      - name: Publish release
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          notes="Tag ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}, built ${built} by run ${GITHUB_RUN_ID}."
          if ! out="$(gh release view deploy --json tagName 2>&1)"; then
            if grep -qi 'release not found' <<<"$out"; then
              gh release create deploy --title "Website release" --notes "$notes" --target "$GITHUB_SHA" --latest=false
            else
              echo "$out" >&2
              exit 1
            fi
          fi
          # Tarball first, then its checksum: a new checksum always has its tarball.
          gh release upload deploy dist/1time-release.tar.gz --clobber
          gh release upload deploy dist/1time-release.tar.gz.sha256 --clobber
          gh release edit deploy --latest=false --notes "$notes"
