name: Frontend

# Builds both editions on every PR. `npm run build` ends with
# scripts/check-links.mjs, so a page that links to something its edition does
# not ship fails here instead of in a release. The self-hosted edition is an
# allowlist of pages (scripts/prune-selfhosted.mjs); without this job it was
# only ever built by docker-publish.yml, on a release tag.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        edition:
          - {name: full, self_hosted: 'false'}
          - {name: self-hosted, self_hosted: 'true'}
    name: build (${{ matrix.edition.name }})
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Same versions as Dockerfile.web.
      - uses: actions/setup-node@v4
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install -g npm@11.12.1
      - run: npm ci
      - run: npm run build
        env:
          SELF_HOSTED: ${{ matrix.edition.self_hosted }}
