name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Image names are part of the public contract: docker-compose.yml and the
# README tell self-hosters to pull these exact paths. They are spelled out
# rather than derived from ${{ github.repository }}, which silently moved the
# published images to 1time.io-{web,backend} when this repo was renamed from
# 1time to 1time.io, leaving the documented packages frozen for six months.
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/shingrus/1time-backend
  WEB_IMAGE: ghcr.io/shingrus/1time-web
  # Where the repo-slug name published from Mar-Sep 2026. Kept as a second
  # target so anyone who pinned it during that window does not break.
  BACKEND_IMAGE_ALT: ghcr.io/shingrus/1time.io-backend
  WEB_IMAGE_ALT: ghcr.io/shingrus/1time.io-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tags_backend=${{ env.BACKEND_IMAGE }}:${VERSION},${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE_ALT }}:${VERSION},${{ env.BACKEND_IMAGE_ALT }}:latest" >> "$GITHUB_OUTPUT"
            echo "tags_web=${{ env.WEB_IMAGE }}:${VERSION},${{ env.WEB_IMAGE }}:latest,${{ env.WEB_IMAGE_ALT }}:${VERSION},${{ env.WEB_IMAGE_ALT }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "tags_backend=${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE_ALT }}:latest" >> "$GITHUB_OUTPUT"
            echo "tags_web=${{ env.WEB_IMAGE }}:latest,${{ env.WEB_IMAGE_ALT }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags_backend }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags_web }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_HOSTNAME=1time.io
            SHOW_BLOG=false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
