# Security headers for every response. Mirrors configs/nginx/snippets/
# 1time-security-headers.conf, minus HSTS: TLS belongs to the self-hoster's
# reverse proxy, and production's "includeSubDomains; preload" would pin
# HTTPS onto every subdomain of the instance's parent domain.
#
# nginx drops server-level add_header directives in any location that has its
# own add_header, so default.conf.template includes this file in each of them.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# 'unsafe-inline' is required: <InlineCss> puts route-critical CSS inline, and
# the full edition carries inline JSON-LD.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
